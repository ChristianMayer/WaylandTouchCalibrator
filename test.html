<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Touch Test Pattern</title>
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #111;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: crosshair;
    }
  </style>
</head>

<body>
  <canvas id="test-canvas"></canvas>
  <div id="data-panel" style="position: fixed; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.92); color: #fff; padding: 10px 15px; font-family: monospace; font-size: 14px; max-height: 260px; overflow-y: auto; z-index: 1000; display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <strong style="font-size: 16px;">📋 Recorded Measurements</strong>
      <div>
        <button id="copy-btn" style="background: #0d6efd; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; margin-right: 6px;">📋 Copy All</button>
        <button id="clear-data-btn" style="background: #dc3545; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px;">🗑 Clear</button>
      </div>
    </div>
    <table style="width: 100%; border-collapse: collapse; font-size: 13px;">
      <thead>
        <tr style="border-bottom: 1px solid #555;">
          <th style="padding: 4px 8px; text-align: left;">Target</th>
          <th style="padding: 4px 8px; text-align: left;">Target (X,Y)</th>
          <th style="padding: 4px 8px; text-align: left;">Measured (X,Y)</th>
          <th style="padding: 4px 8px; text-align: left;">Diff (px)</th>
        </tr>
      </thead>
      <tbody id="data-body"></tbody>
    </table>
  </div>
  <script>
    const canvas = document.getElementById('test-canvas');
    const ctx = canvas.getContext('2d');
    let activePointers = {};
    let lastPointers = {};
    let fingerCounter = 1;
    let targets = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      generateTargets();
    }
    window.addEventListener('resize', resizeCanvas);

    function generateTargets() {
      let w = canvas.width;
      let h = canvas.height;
      let m = Math.min(100, Math.min(w, h) / 4);
      targets = [
        { x: m, y: m, label: 'T1' },
        { x: w / 2, y: m, label: 'T2' },
        { x: w - m, y: m, label: 'T3' },
        { x: m, y: h / 2, label: 'T4' },
        { x: w / 2, y: h / 2, label: 'T5' },
        { x: w - m, y: h / 2, label: 'T6' },
        { x: m, y: h - m, label: 'T7' },
        { x: w / 2, y: h - m, label: 'T8' },
        { x: w - m, y: h - m, label: 'T9' }
      ].map(t => ({ x: Math.round(t.x), y: Math.round(t.y), label: t.label }));
    }

    function drawPatterns(w, h) {
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 1;
      for (let x = 0; x <= w; x += 100) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
      for (let y = 0; y <= h; y += 100) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }

      // Overscan border
      ctx.strokeStyle = 'rgba(255, 0, 0, 0.8)';
      ctx.lineWidth = 2;
      ctx.strokeRect(1, 1, w - 2, h - 2);

      // Blue diagonals and diamond
      ctx.strokeStyle = '#0055ff'; // Using a slightly brighter blue for dark background
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(w, h); // Diagonal TL to BR
      ctx.moveTo(w, 0); ctx.lineTo(0, h); // Diagonal TR to BL
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(w / 2, 0); ctx.lineTo(w, h / 2);
      ctx.lineTo(w / 2, h); ctx.lineTo(0, h / 2);
      ctx.closePath();
      ctx.stroke();

      ctx.strokeStyle = '#444';
      let rad = 50;
      [[0, 0], [w, 0], [0, h], [w, h], [w / 2, h / 2]].forEach(pt => {
        ctx.beginPath(); ctx.arc(pt[0], pt[1], rad, 0, 2 * Math.PI); ctx.stroke();
        ctx.beginPath(); ctx.arc(pt[0], pt[1], rad * 2, 0, 2 * Math.PI); ctx.stroke();
      });

      // Overscan border
      /*ctx.strokeStyle = 'rgba(255, 0, 0, 0.8)';
      ctx.lineWidth = 2;
      ctx.strokeRect(1, 1, w-2, h-2);*/

      // Draw resolution info
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.font = '24px monospace';
      let resText = `Resolution: ${w}x${h}`;
      let resTw = ctx.measureText(resText).width;
      ctx.fillText(resText, (w - resTw) / 2, 40);
    }

    function drawTargets() {
      let w = canvas.width;
      ctx.strokeStyle = '#0f0';
      ctx.fillStyle = '#0f0';
      ctx.lineWidth = 2;
      ctx.font = '20px monospace';

      targets.forEach(t => {
        ctx.beginPath();
        ctx.moveTo(t.x - 30, t.y); ctx.lineTo(t.x + 30, t.y);
        ctx.moveTo(t.x, t.y - 30); ctx.lineTo(t.x, t.y + 30);
        ctx.stroke();

        let text = `${t.label}: ${t.x}, ${t.y}`;
        let tw = ctx.measureText(text).width;
        let txtX = t.x + 15;
        if (txtX + tw > w - 10) {
          txtX = t.x - 15 - tw;
        }
        let txtY = t.y - 15;
        if (txtY < 20) {
          txtY = t.y + 30;
        }
        ctx.fillText(text, txtX, txtY);
      });
    }

    function drawPointers() {
      let w = canvas.width;
      let h = canvas.height;

      let drawPtr = (pt, color) => {
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(pt.x - 40, pt.y); ctx.lineTo(pt.x + 40, pt.y);
        ctx.moveTo(pt.x, pt.y - 40); ctx.lineTo(pt.x, pt.y + 40);
        ctx.stroke();

        ctx.font = '24px monospace';
        let txt = `${pt.label}: ${Math.round(pt.x)}, ${Math.round(pt.y)}`;

        let txtX = pt.x + 20;
        let txtY = pt.y + 30;
        if (txtX + 250 > w) txtX = pt.x - 250;
        if (txtY > h - 10) txtY = pt.y - 30;

        ctx.fillText(txt, txtX, txtY);
      };

      for (let id in lastPointers) {
        drawPtr(lastPointers[id], '#a00'); // Dark red for last pointer
      }
      for (let id in activePointers) {
        drawPtr(activePointers[id], '#f00'); // Bright red for active pointer
      }
    }

    function testLoop() {
      let w = canvas.width;
      let h = canvas.height;

      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, w, h);

      drawPatterns(w, h);
      drawTargets();
      drawPointers();

      requestAnimationFrame(testLoop);
    }

    function updateTouch(e) {
      e.preventDefault();

      // Clear last pointers on new interaction
      if (e.type === 'touchstart' && Object.keys(activePointers).filter(k => k.startsWith('touch_')).length === 0) {
        lastPointers = {};
      }

      let newActive = {};
      for (let i = 0; i < e.touches.length; i++) {
        let t = e.touches[i];
        let idStr = 'touch_' + t.identifier;
        let label = activePointers[idStr] ? activePointers[idStr].label : `Finger ${fingerCounter++}`;
        newActive[idStr] = { x: t.clientX, y: t.clientY, label: label };
      }

      // Check for ended touches
      for (let id in activePointers) {
        if (id.startsWith('touch_') && !newActive[id]) {
          lastPointers[id] = activePointers[id];
        }
      }

      if (e.touches.length === 0) fingerCounter = 1;

      // Keep mouse if exists
      if (activePointers['mouse']) {
        newActive['mouse'] = activePointers['mouse'];
      }

      activePointers = newActive;
    }

    canvas.addEventListener('touchstart', updateTouch, { passive: false });
    canvas.addEventListener('touchmove', updateTouch, { passive: false });
    canvas.addEventListener('touchend', updateTouch, { passive: false });
    canvas.addEventListener('touchcancel', updateTouch, { passive: false });

    canvas.addEventListener('mousedown', (e) => {
      if (Object.keys(activePointers).length === 0) {
        lastPointers = {};
      }
      activePointers['mouse'] = { x: e.clientX, y: e.clientY, label: 'Mouse' };
    });
    canvas.addEventListener('mousemove', (e) => {
      if (activePointers['mouse']) {
        activePointers['mouse'] = { x: e.clientX, y: e.clientY, label: 'Mouse' };
      }
    });
    window.addEventListener('mouseup', () => {
      if (activePointers['mouse']) {
        let pt = activePointers['mouse'];
        lastPointers['mouse'] = pt;
        delete activePointers['mouse'];
        // Record mouse click (for testing on non-touch displays)
        recordTouchOrClick(pt.x, pt.y, 'Mouse');
      }
    });

    // After touchend/touchcancel, record the measurement
    function recordTouchOrClick(x, y, label) {
      let result = findNearestTarget(x, y);
      if (result.dist < 150) {
        recordedData.push({
          targetLabel: result.target.label,
          targetX: result.target.x,
          targetY: result.target.y,
          measuredX: Math.round(x),
          measuredY: Math.round(y),
          diff: Math.round(result.dist)
        });
        updateDataTable();
        document.getElementById('data-panel').style.display = 'block';
      }
    }

    function findNearestTarget(x, y) {
      let best = null, bestDist = Infinity;
      for (let t of targets) {
        let d = Math.sqrt((t.x - x) ** 2 + (t.y - y) ** 2);
        if (d < bestDist) { bestDist = d; best = t; }
      }
      return { target: best, dist: bestDist };
    }

    // The updateTouch function above (line 170) already handles touchend by
    // moving pointers to lastPointers. We add recording logic there by
    // re-registering the listener with a wrapper.
    // Remove old listeners and add new ones that also record data
    function touchHandlerWrapper(e) {
      let ended = [];
      if ((e.type === 'touchend' || e.type === 'touchcancel') && e.changedTouches) {
        for (let i = 0; i < e.changedTouches.length; i++) {
          ended.push({ x: e.changedTouches[i].clientX, y: e.changedTouches[i].clientY });
        }
      }
      updateTouch(e);
      for (let et of ended) {
        recordTouchOrClick(et.x, et.y, 'Touch');
      }
    }

    // Replace touch listeners
    canvas.removeEventListener('touchstart', updateTouch);
    canvas.removeEventListener('touchmove', updateTouch);
    canvas.removeEventListener('touchend', updateTouch);
    canvas.removeEventListener('touchcancel', updateTouch);
    canvas.addEventListener('touchstart', touchHandlerWrapper, { passive: false });
    canvas.addEventListener('touchmove', touchHandlerWrapper, { passive: false });
    canvas.addEventListener('touchend', touchHandlerWrapper, { passive: false });
    canvas.addEventListener('touchcancel', touchHandlerWrapper, { passive: false });

    resizeCanvas();
    testLoop();

    // --- Data table UI ---
    let recordedData = [];

    function updateDataTable() {
      let tbody = document.getElementById('data-body');
      tbody.innerHTML = '';
      for (let d of recordedData) {
        let tr = document.createElement('tr');
        tr.style.borderBottom = '1px solid #333';
        tr.innerHTML =
          `<td style="padding: 3px 8px;">${d.targetLabel}</td>` +
          `<td style="padding: 3px 8px;">${d.targetX}, ${d.targetY}</td>` +
          `<td style="padding: 3px 8px;">${d.measuredX}, ${d.measuredY}</td>` +
          `<td style="padding: 3px 8px;">${d.diff}px</td>`;
        tbody.appendChild(tr);
      }
    }

    document.getElementById('copy-btn').addEventListener('click', () => {
      let text = recordedData.map(d =>
        `${d.targetX} ${d.targetY} ${d.measuredX} ${d.measuredY}`
      ).join('\n');
      navigator.clipboard.writeText(text).then(() => {
        let btn = document.getElementById('copy-btn');
        btn.textContent = '✅ Copied!';
        setTimeout(() => { btn.textContent = '📋 Copy All'; }, 2000);
      });
    });
    document.getElementById('clear-data-btn').addEventListener('click', () => {
      recordedData = [];
      updateDataTable();
      document.getElementById('data-panel').style.display = 'none';
    });
  </script>
</body>

</html>
